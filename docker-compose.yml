version: "3.8"
services:
  api:
    build: ./apps/api
    ports: ["3001:3001"]
    environment:
      - PORT=3001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - WEB_ORIGIN=http://localhost:3000
  web:
    build: ./apps/web
    ports: ["3000:3000"]
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:3001/api
